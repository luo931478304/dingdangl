<script>
    // ---------- 版本号 ----------
    const APP_VERSION = "1.2.0";
    
    // ---------- 全局配置 ----------
    const MONTHLY_SALARY = 2000;
    const WORK_DAYS = 22;
    const DAILY_SALARY = MONTHLY_SALARY / WORK_DAYS;
    const PUBLIC_SEA_DAYS = 30;
    const BMOB_CONFIG = {
        secretKey: "b2628616e5656905",
        apiSafeCode: "zx123456"
    };

    const PRESET_TAGS = ["高意向", "已报价", "需跟进", "已约访", "待成交", "已合作", "无需求"];
    
    let globalRecommendations = {
        solution: "标准包装盒，多材质可选，支持小批量定制。可根据客户需求提供环保、高档、经济等多种方案。",
        script: "您好，我是XX包装的客服，看到您最近有包装需求，我们提供多种材质和工艺选择，可以免费打样，方便了解一下您的具体要求吗？"
    };
    let operatorScripts = {};

    function getRecommendationsForOperator(operatorId) {
        const personalScript = operatorScripts[operatorId];
        return {
            solution: globalRecommendations.solution,
            script: personalScript || globalRecommendations.script
        };
    }

    // ---------- 数据库 ----------
    let users = [
        { id: 1, name: "李芳", role: "operator", password: "123" },
        { id: 2, name: "王丽", role: "operator", password: "123" },
        { id: 3, name: "张敏", role: "operator", password: "123" },
        { id: 99, name: "管理员", role: "admin", password: "xinyun333" }
    ];
    let records = [];
    let orders = [];
    let dailyCalls = {};
    let dailyWechat = {};
    let followups = [];
    let storageMode = "local";
    let bmobReady = false;
    let saveTimer = null;
    let saveInFlight = false;
    let saveQueued = false;
    let syncStatusText = "本地模式";
    let localSnapshot = null;
    const CUSTOMER_BATCH_SIZE = 30;
    let operationLogs = [];
    let customerVisibleCounts = {};
    let customerListObservers = {};
    let customerFilters = {
        search: "",
        intentLevel: "",
        hasWechat: "",
        isVisit: "",
        tag: "",
        sortBy: "latest"
    };

    function formatErrorMessage(err) {
        if (!err) return "未知错误";
        if (typeof err === "string") return err;
        if (err.message) return err.message;
        if (err.error) return err.error;
        try {
            return JSON.stringify(err);
        } catch (jsonErr) {
            return "未知错误";
        }
    }

    function sanitizeBmobPayload(payload) {
        const clean = {};
        Object.keys(payload).forEach(key => {
            const val = payload[key];
            if (val === undefined || val === null) return;
            if (typeof val === "number" && Number.isNaN(val)) return;
            clean[key] = val;
        });
        return clean;
    }

    function deepClone(data) {
        return JSON.parse(JSON.stringify(data));
    }

    function captureLocalSnapshot() {
        localSnapshot = {
            users: deepClone(users),
            records: deepClone(records),
            orders: deepClone(orders),
            dailyCalls: deepClone(dailyCalls),
            dailyWechat: deepClone(dailyWechat),
            followups: deepClone(followups),
            globalRecommendations: deepClone(globalRecommendations),
            operatorScripts: deepClone(operatorScripts)
        };
    }

    function hasLocalSnapshotData() {
        if (!localSnapshot) return false;
        return (
            (localSnapshot.records || []).length > 0 ||
            (localSnapshot.orders || []).length > 0 ||
            (localSnapshot.followups || []).length > 0 ||
            Object.keys(localSnapshot.dailyCalls || {}).length > 0 ||
            Object.keys(localSnapshot.dailyWechat || {}).length > 0
        );
    }

    function getLocalSnapshotSummaryText() {
        if (!hasLocalSnapshotData()) return "";
        return `本机缓存：客户 ${localSnapshot.records.length} 条，跟进 ${localSnapshot.followups.length} 条，订单 ${localSnapshot.orders.length} 条`;
    }

    function applySnapshot(snapshot) {

        followups = deepClone(snapshot.followups || []);

    function recordLog(action, detail) {
        operationLogs.unshift({

            time: new Date().toLocaleString(),

        operationLogs = operationLogs.slice(0, 120);

    function getTodayStr() {
        return new Date().toISOString().slice(0,10);
    }

    function compareDateDesc(a, b) {
        return (b || "").localeCompare(a || "");
    }

    function getDaysUntilPublicSea(record) {
        if (!record || record.hasOrder || record.intentLevel === 3 || !record.lastFollowupTime) return null;
        const lastTime = new Date(record.lastFollowupTime);
        const today = new Date();
        const diffDays = Math.floor((today - lastTime) / (1000 * 60 * 60 * 24));
        return PUBLIC_SEA_DAYS - diffDays;
    }

    function getFilteredCustomers(list) {
        let filtered = [...list];
        const keyword = customerFilters.search.trim().toLowerCase();
        if (keyword) {
            filtered = filtered.filter(item =>
                [item.customerName, item.contactPerson, item.contactPhone, item.position, item.content, (item.tags || []).join(",")]
                    .filter(Boolean)
                    .some(value => String(value).toLowerCase().includes(keyword))
            );
        }
        if (customerFilters.intentLevel) {
            filtered = filtered.filter(item => String(item.intentLevel) === customerFilters.intentLevel);
        }
        if (customerFilters.hasWechat) {
            filtered = filtered.filter(item => String(item.hasWechat === 1 ? 1 : 0) === customerFilters.hasWechat);
        }
        if (customerFilters.isVisit) {
            filtered = filtered.filter(item => String(item.isVisit === 1 ? 1 : 0) === customerFilters.isVisit);
        }
        if (customerFilters.tag) {
            filtered = filtered.filter(item => (item.tags || []).includes(customerFilters.tag));
        }
        if (customerFilters.sortBy === "oldest") filtered.sort((a,b) => (a.createTime || "").localeCompare(b.createTime || ""));
        else if (customerFilters.sortBy === "nextFollowup") filtered.sort((a,b) => (a.nextFollowupTime || "9999-99-99").localeCompare(b.nextFollowupTime || "9999-99-99"));
        else if (customerFilters.sortBy === "lastFollowup") filtered.sort((a,b) => compareDateDesc(a.lastFollowupTime, b.lastFollowupTime));
        else filtered.sort((a,b) => compareDateDesc(a.createTime, b.createTime));
        return filtered;
    }

    function getOperatorWorkbenchData(operatorId) {
        const today = getTodayStr();
        const mine = getMyPendingCustomers(operatorId);
        const dueToday = mine.filter(item => item.nextFollowupTime && item.nextFollowupTime <= today);
        const highIntent = mine.filter(item => item.intentLevel === 2 && !item.hasOrder);
        const untouched = mine.filter(item => {
            const daysLeft = getDaysUntilPublicSea(item);
            return daysLeft !== null && daysLeft <= 7 && daysLeft >= 0;
        });
        const publicSea = getPublicSeaCustomers();
        return { mine, dueToday, highIntent, untouched, publicSea };
    }

    function getAdminOverviewData() {
        const today = getTodayStr();
        const activeOperators = users.filter(u => u.role === "operator" && u.active !== false).length;
        const dueCount = records.filter(item => item.nextFollowupTime && item.nextFollowupTime <= today && !item.hasOrder).length;
        const todayCreated = records.filter(item => item.createTime === today).length;
        const weekAgo = new Date();
        weekAgo.setDate(weekAgo.getDate() - 6);
        const weekAgoStr = weekAgo.toISOString().slice(0,10);
        const weekNew = records.filter(item => item.createTime >= weekAgoStr).length;
        const weekOrders = orders.filter(item => (item.paidTime || "") >= weekAgoStr).length;
        const monthAmount = orders.reduce((sum, item) => sum + (item.orderAmount || 0), 0);
        return {
            activeOperators,
            dueCount,
            todayCreated,
            weekNew,
            weekOrders,
            monthAmount,
            publicSea: getPublicSeaCustomers().length,
            totalCustomers: records.length
        };
    }

    async function initBmob() {
        const sdkLoaded = await window.__bmobReadyPromise;
        if (!sdkLoaded || !window.Bmob) {
            setSyncStatus("Bmob SDK 加载失败，当前使用本地模式");
            return false;
        }
        if (!isBmobConfigured()) {
            setSyncStatus("未填写 Bmob 密钥，当前使用本地模式");
            return false;

        try {
            window.Bmob.initialize(BMOB_CONFIG.secretKey, BMOB_CONFIG.apiSafeCode);

            storageMode = "bmob";
            setSyncStatus("在线模式已连接");
            return true;

            setSyncStatus("Bmob 初始化失败：" + formatErrorMessage(err));

        }

    function normalizeTagValue(value) {
        if (Array.isArray(value)) return value.filter(Boolean);
        if (typeof value === "string") return value.split(",").map(s => s.trim()).filter(Boolean);
        return [];
    }

    function normalizeRecordShape() {
        records.forEach(rec => {
            if (rec.createDate && !rec.createTime) rec.createTime = rec.createDate;
            if (rec.lastFollowupDate && !rec.lastFollowupTime) rec.lastFollowupTime = rec.lastFollowupDate;
            if (rec.nextFollowupDate !== undefined && rec.nextFollowupTime === undefined) rec.nextFollowupTime = rec.nextFollowupDate;
            if (rec.nextFollowupTime === undefined) rec.nextFollowupTime = null;
            if (rec.visitDate === undefined) rec.visitDate = null;
            if (rec.lastFollowupTime === undefined) rec.lastFollowupTime = rec.createTime || new Date().toISOString().slice(0,10);
            if (rec.tags === undefined) rec.tags = [];
            rec.tags = normalizeTagValue(rec.tags);
            rec.hasWechat = rec.hasWechat === 1 || rec.hasWechat === true ? 1 : 0;
            rec.isVisit = rec.isVisit === 1 || rec.isVisit === true ? 1 : 0;
            rec.hasOrder = rec.hasOrder === true;
            if (rec.auditStatus === undefined) rec.auditStatus = 1;
        });
        followups.forEach(f => {
            if (f.createDate && !f.createTime) f.createTime = f.createDate;
            if (f.nextFollowupDate !== undefined && f.nextFollowup === undefined) f.nextFollowup = f.nextFollowupDate;
            f.isVisit = f.isVisit === 1 || f.isVisit === true ? 1 : 0;
        });
        orders.forEach(o => {
            if (o.paidDate && !o.paidTime) o.paidTime = o.paidDate;
            o.isPaid = o.isPaid === 1 || o.isPaid === true ? 1 : 0;
        });
        users.forEach(u => {
            if (u.active === undefined) u.active = true;
        });
    }

    function inferUserId(user, fallbackIndex) {
        const presetIds = {
            "李芳": 1,
            "王丽": 2,
            "张敏": 3,
            "管理员": 99
        };
        if (typeof user.id === "number") return user.id;
        if (typeof user.id === "string" && /^\d+$/.test(user.id)) return parseInt(user.id, 10);
        if (presetIds[user.name]) return presetIds[user.name];
        return 100 + fallbackIndex;
    }

    function normalizeRemoteUsers(remoteUsers) {
        return remoteUsers.map((item, index) => ({
            _bmobId: item.objectId || item._bmobId || null,
            id: inferUserId({ id: item.crmId || item.id, name: item.name }, index),
            name: item.name || "",
            role: item.role || "operator",
            password: item.password || "",
            active: item.active !== false
        }));
    }

    function normalizeRemoteRecords(remoteRecords) {
        return remoteRecords.map(item => ({
            _bmobId: item.objectId || item._bmobId || null,
            id: typeof item.crmId === "number" ? item.crmId : parseInt(item.crmId || item.id, 10),
            operatorId: typeof item.operatorId === "number" ? item.operatorId : (item.operatorId && /^\d+$/.test(item.operatorId) ? parseInt(item.operatorId, 10) : item.operatorId),
            operatorName: item.operatorName || "",
            customerName: item.customerName || "",
            contactPerson: item.contactPerson || "",
            position: item.position || "",
            contactPhone: item.contactPhone || "",
            content: item.content || "",
            intentLevel: typeof item.intentLevel === "number" ? item.intentLevel : parseInt(item.intentLevel || "1", 10),
            hasWechat: item.hasWechat === true || item.hasWechat === 1 ? 1 : 0,
            createTime: item.createTime || item.createDate || new Date().toISOString().slice(0,10),
            auditStatus: item.auditStatus === undefined ? 1 : item.auditStatus,
            hasOrder: item.hasOrder === true,
            followupCount: typeof item.followupCount === "number" ? item.followupCount : parseInt(item.followupCount || "0", 10),
            lastFollowupTime: item.lastFollowupTime || item.lastFollowupDate || item.createTime || item.createDate || new Date().toISOString().slice(0,10),
            nextFollowupTime: item.nextFollowupTime || item.nextFollowupDate || null,
            isVisit: item.isVisit === true || item.isVisit === 1 ? 1 : 0,
            visitDate: item.visitDate || null,

        })).filter(item => !Number.isNaN(item.id));

    function normalizeRemoteOrders(remoteOrders) {
        return remoteOrders.map(item => ({
            _bmobId: item.objectId || item._bmobId || null,
            id: typeof item.crmId === "number" ? item.crmId : parseInt(item.crmId || item.id, 10),
            recordId: typeof item.recordId === "number" ? item.recordId : parseInt(item.recordId || item.customerId || item.customerCrmId || "0", 10),
            orderNo: item.orderNo || "",
            orderAmount: typeof item.orderAmount === "number" ? item.orderAmount : parseFloat(item.orderAmount || "0"),
            commission: typeof item.commission === "number" ? item.commission : parseFloat(item.commission || "0"),
            isPaid: item.isPaid === true || item.isPaid === 1 ? 1 : 0,
            paidTime: item.paidTime || item.paidDate || new Date().toISOString().slice(0,10),

            customCost: item.customCost === null || item.customCost === undefined ? null : parseFloat(item.customCost)

    function normalizeRemoteFollowups(remoteFollowups) {
        return remoteFollowups.map(item => ({
            _bmobId: item.objectId || item._bmobId || null,
            id: typeof item.crmId === "number" ? item.crmId : parseInt(item.crmId || item.id, 10),
            recordId: typeof item.recordId === "number" ? item.recordId : parseInt(item.recordId || item.customerId || item.customerCrmId || "0", 10),
            operatorId: typeof item.operatorId === "number" ? item.operatorId : (item.operatorId && /^\d+$/.test(item.operatorId) ? parseInt(item.operatorId, 10) : item.operatorId),
            content: item.content || "",
            createTime: item.createTime || item.createDate || new Date().toISOString().slice(0,10),
            nextFollowup: item.nextFollowup || item.nextFollowupDate || null,
            isVisit: item.isVisit === true || item.isVisit === 1 ? 1 : 0,
            visitDate: item.visitDate || null
        })).filter(item => !Number.isNaN(item.id));
    }

    function normalizeRemoteDailyStats(remoteStats) {
        const calls = {};
        const wechats = {};
        remoteStats.forEach(item => {
            const opId = item.operatorId;
            const date = item.date;
            if (!opId || !date) return;
            const key = `${opId}-${date}`;
            calls[key] = parseInt(item.callCount || 0, 10);
            wechats[key] = parseInt(item.wechatCount || 0, 10);
        });
        dailyCalls = calls;
        dailyWechat = wechats;
    }

    function normalizeRemoteSettings(remoteSettings) {
        operatorScripts = {};
        remoteSettings.forEach(item => {
            if (item.key === "global_solution") globalRecommendations.solution = item.value || globalRecommendations.solution;
            if (item.key === "global_script") globalRecommendations.script = item.value || globalRecommendations.script;
            if (item.key && item.key.startsWith("operator_script_")) {
                const operatorId = item.key.replace("operator_script_", "");
                operatorScripts[operatorId] = item.value || "";
            }
        });
    }

    async function fetchAllRows(tableName) {
        const query = window.Bmob.Query(tableName);
        if (typeof query.limit === "function") query.limit(1000);
        const res = await query.find();
        if (Array.isArray(res)) return res;
        if (res && Array.isArray(res.results)) return res.results;
        return [];
    }

    async function loadRemoteData() {
        const remoteUsers = await fetchAllRows("users");
        const remoteCustomers = await fetchAllRows("customers");
        const remoteOrders = await fetchAllRows("orders");
        const remoteFollowups = await fetchAllRows("followups");
        let remoteDailyStats = [];
        let remoteSettings = [];
        try { remoteDailyStats = await fetchAllRows("daily_stats"); } catch (err) { console.warn("daily_stats not found", err); }
        try { remoteSettings = await fetchAllRows("settings"); } catch (err) { console.warn("settings not found", err); }

        if (remoteUsers.length) users = normalizeRemoteUsers(remoteUsers);
        if (remoteCustomers.length) records = normalizeRemoteRecords(remoteCustomers);
        if (remoteOrders.length) orders = normalizeRemoteOrders(remoteOrders);
        if (remoteFollowups.length) followups = normalizeRemoteFollowups(remoteFollowups);
        if (remoteDailyStats.length) normalizeRemoteDailyStats(remoteDailyStats);
        if (remoteSettings.length) normalizeRemoteSettings(remoteSettings);
    }

        loadLocalCache();
        normalizeRecordShape();
        captureLocalSnapshot();

        try {

            setSyncStatus("在线数据加载失败：" + formatErrorMessage(err));
        }
    }

    async function syncTable(tableName, localItems, plainMapper, idField, deleteStale = true) {
        const remoteItems = await fetchAllRows(tableName);
        const remoteMap = new Map();
        remoteItems.forEach(item => {
            if (item[idField] !== undefined && item[idField] !== null) {
                remoteMap.set(String(item[idField]), item);
            }
        });

        for (const item of localItems) {
            const plain = sanitizeBmobPayload(plainMapper(item));
            const key = String(plain[idField]);
            const query = window.Bmob.Query(tableName);
            const remote = remoteMap.get(key);
            if (item._bmobId) query.set("id", item._bmobId);
            else if (remote && remote.objectId) query.set("id", remote.objectId);
            Object.keys(plain).forEach(field => query.set(field, plain[field]));
            const res = await query.save();
            if (res && res.objectId) item._bmobId = res.objectId;
            if (remote) remoteMap.delete(key);
        }

        if (deleteStale) {
            for (const stale of remoteMap.values()) {
                if (stale.objectId) {
                    const query = window.Bmob.Query(tableName);
                    await query.destroy(stale.objectId);
                }
            }
        }
    }

    async function syncSettingsTable(deleteStale = true) {
        const tableName = "settings";
        const remoteItems = await fetchAllRows(tableName);
        const managedPrefix = "operator_script_";
        const managedMap = new Map();
        remoteItems.forEach(item => {
            if (item.key === "app_name" || item.key === "global_solution" || item.key === "global_script" || (item.key || "").startsWith(managedPrefix)) {
                managedMap.set(item.key, item);
            }
        });
        const localRows = getManagedSettingsRows();
        const localKeys = new Set();

        for (const row of localRows) {
            localKeys.add(row.key);
            const query = window.Bmob.Query(tableName);
            const remote = managedMap.get(row.key);
            if (remote && remote.objectId) query.set("id", remote.objectId);
            const plain = sanitizeBmobPayload({
                key: row.key,
                value: row.value
            });
            Object.keys(plain).forEach(field => query.set(field, plain[field]));
            await query.save();
            managedMap.delete(row.key);
        }

        if (deleteStale) {
            for (const stale of managedMap.values()) {
                if (stale.objectId && !localKeys.has(stale.key)) {
                    const query = window.Bmob.Query(tableName);
                    await query.destroy(stale.objectId);
                }
            }
        }
    }

    async function runRemoteSave() {
        if (storageMode !== "bmob" || !bmobReady) return;
        if (saveInFlight) {
            saveQueued = true;
            return;
        }
        saveInFlight = true;
        setSyncStatus("在线同步中...");
        try {
            await syncTable("users", users, item => ({
                crmId: item.id,
                name: item.name,
                role: item.role,
                password: item.password,
                active: item.active !== false
            }), "crmId");
            await syncTable("customers", records, toPlainCustomer, "crmId");
            await syncTable("followups", followups, toPlainFollowup, "crmId");
            await syncTable("orders", orders, toPlainOrder, "crmId");
            await syncTable("daily_stats", getDailyStatRows(), item => item, "syncKey");
            await syncSettingsTable();
            setSyncStatus("在线同步成功 " + new Date().toLocaleTimeString());
        } catch (err) {
            console.error("remote sync failed", err);
            setSyncStatus("在线同步失败：" + formatErrorMessage(err));
        } finally {
            saveInFlight = false;
            if (saveQueued) {
                saveQueued = false;
                queueRemoteSave();
            }
        }
    }

    function calculateOrderCommission(order) {
        let cost = (order.customCost !== undefined && order.customCost > 0) ? order.customCost : order.cost;
        if (!cost || cost <= 0) return 0;
        let profit = order.orderAmount - cost;
        let commission = profit * 0.30;
        if (commission > 300) commission = 300;
        return commission;
    }

    function updateRecordFollowupStats(recordId) {
        let rec = records.find(r => r.id === recordId);
        if (!rec) return;
        let recFollowups = followups.filter(f => f.recordId === recordId);
        rec.followupCount = recFollowups.length;
        if (recFollowups.length > 0) {
            const latest = recFollowups.reduce((a,b) => a.createTime > b.createTime ? a : b).createTime;
            rec.lastFollowupTime = latest;
            const latestWithNext = recFollowups.reduce((a,b) => (a.createTime > b.createTime ? a : b), recFollowups[0]);
            rec.nextFollowupTime = latestWithNext.nextFollowup || null;
        } else {
            rec.lastFollowupTime = rec.createTime;
            rec.nextFollowupTime = null;
        }
        let hasVisit = recFollowups.some(f => f.isVisit === 1);
        if (hasVisit && !rec.isVisit) {
            rec.isVisit = 1;
            const visitFollowup = recFollowups.find(f => f.isVisit === 1);
            rec.visitDate = visitFollowup ? visitFollowup.visitDate : null;
        } else if (!hasVisit) {
            rec.isVisit = 0;
            rec.visitDate = null;
        }
    }

    function isInPublicSea(record) {
        if (record.auditStatus !== 1) return false;
        if (record.hasOrder) return false;
        if (record.intentLevel === 3) return false;
        if (!record.lastFollowupTime) return false;
        const lastTime = new Date(record.lastFollowupTime);
        const today = new Date();
        const diffDays = Math.floor((today - lastTime) / (1000 * 60 * 60 * 24));
        return diffDays >= PUBLIC_SEA_DAYS;
    }

    // 业绩统计等函数
    function calculateStats(operatorId) {
        let myRecords = getMyPendingCustomers(operatorId);
        let validIntents = myRecords.filter(r => r.intentLevel === 1).length;
        let deepIntents = myRecords.filter(r => r.intentLevel === 2).length;
        let invalidCount = records.filter(r => r.operatorId === operatorId && r.auditStatus === 1 && !r.hasOrder && r.intentLevel === 3).length;
        let visitCount = myRecords.filter(r => r.isVisit === 1).length;
        let wechatCount = myRecords.filter(r => r.hasWechat === 1).length;
        let basePoints = validIntents * 1 + deepIntents * 2;
        let myOrders = orders.filter(o => {
            let rec = records.find(r=>r.id===o.recordId);
            return rec && rec.operatorId === operatorId && o.isPaid === 1;
        });
        let totalOrderAmount = myOrders.reduce((s,o)=>s+o.orderAmount,0);
        let bonusPoints = 0;
        for (let o of myOrders) {
            if (o.orderAmount < 5000) bonusPoints += 2;
            else if (o.orderAmount < 20000) bonusPoints += 5;
            else bonusPoints += 10;
        }
        let totalPoints = basePoints + bonusPoints;
        let conversionRate = basePoints === 0 ? 1 : myOrders.length / basePoints;
        let intentBonus = totalPoints;
        if (conversionRate < 0.01) intentBonus = 0;
        else if (conversionRate < 0.03) intentBonus = intentBonus * 0.6;
        else if (conversionRate < 0.05) intentBonus = intentBonus * 0.8;
        let penalty = 0;
        if (invalidCount > 5) {
            penalty = intentBonus * 0.05 * (invalidCount - 5);
            if (penalty > intentBonus) penalty = intentBonus;
        }
        if (invalidCount > 15) intentBonus = 0;
        else intentBonus = intentBonus - penalty;
        if (intentBonus < 0) intentBonus = 0;
        let visitBonus = visitCount * 10;
        let orderCommission = myOrders.reduce((sum, o) => sum + (o.commission || calculateOrderCommission(o)), 0);
        return { validIntents, deepIntents, invalidCount, visitCount, wechatCount, totalPoints, orderCount: myOrders.length, totalOrderAmount, intentBonus, visitBonus, orderCommission, totalBonus: intentBonus + visitBonus + orderCommission };
    }
    function getDailyStats(operatorId, date) {
        let dayRecords = records.filter(r => r.operatorId === operatorId && r.createTime === date && r.auditStatus === 1);
        let validIntents = dayRecords.filter(r => r.intentLevel === 1).length;
        let deepIntents = dayRecords.filter(r => r.intentLevel === 2).length;
        let visitSuccess = dayRecords.filter(r => r.isVisit === 1 && r.intentLevel !== 3).length;
        let callCount = dailyCalls[`${operatorId}-${date}`] || 0;
        let wechatCount = dailyWechat[`${operatorId}-${date}`] || 0;
        return { validIntents, deepIntents, visitSuccess, callCount, wechatCount };
    }
    function getTotalWechat(operatorId) {

    function addFollowup(recordId) {
        let record = records.find(r => r.id === recordId);
        if (!record) return;
        if (record.hasOrder) { alert("已合作客户不能添加跟进"); return; }
        let content = prompt("请输入跟进内容：");
        if (!content || content.trim() === "") return;
        let isVisit = confirm("本次跟进是否约访成功？（客户同意业务上门/到厂）");
        let visitDate = null;
        if (isVisit) {
            let visitDateStr = prompt("请输入约访日期（格式YYYY-MM-DD）：", new Date().toISOString().slice(0,10));
            if (visitDateStr && visitDateStr.trim().match(/^\d{4}-\d{2}-\d{2}/)) visitDate = visitDateStr.trim().match(/^\d{4}-\d{2}-\d{2}/)[0];
            else isVisit = false;
        }
        let nextFollowupDate = null;
        let nextFollowup = prompt("请输入下次跟进时间（格式YYYY-MM-DD），不填则无提醒：", "");
        if (nextFollowup && nextFollowup.trim().match(/^\d{4}-\d{2}-\d{2}/)) nextFollowupDate = nextFollowup.trim().match(/^\d{4}-\d{2}-\d{2}/)[0];
        let newFollowup = { id: getNextFollowupId(), recordId: recordId, operatorId: currentUser.id, content: content.trim(), createTime: new Date().toISOString().slice(0,10), nextFollowup: nextFollowupDate, isVisit: isVisit ? 1 : 0, visitDate: visitDate };
        followups.push(newFollowup);
        updateRecordFollowupStats(recordId);
        saveData();
        alert("跟进记录已添加");
        refreshUI();
    }
    function toggleWechat(recordId) { let r=records.find(r=>r.id===recordId); if(r){ r.hasWechat = r.hasWechat===1?0:1; saveData(); refreshUI(); } }
    function toggleTag(recordId, tag) { let r=records.find(r=>r.id===recordId); if(r){ if(!r.tags) r.tags=[]; const idx=r.tags.indexOf(tag); if(idx===-1) r.tags.push(tag); else r.tags.splice(idx,1); saveData(); refreshUI(); } }
    function viewFollowups(recordId) {
        let record = records.find(r=>r.id===recordId);
        if(!record) return;
        let followupList = followups.filter(f=>f.recordId===recordId);
        if(!followupList.length){ alert("暂无跟进记录"); return; }
        let modal=document.createElement('div'); modal.className='modal'; modal.style.display='flex';
        let listHtml=followupList.map(f=>`<div><strong>${f.createTime}</strong> (${users.find(u=>u.id===f.operatorId)?.name||'未知'})<br>${f.content}<br>${f.isVisit?`约访成功 ${f.visitDate}`:''} ${f.nextFollowup?`下次跟进:${f.nextFollowup}`:''}</div><hr>`).join('');
        modal.innerHTML=`<div class="modal-content"><span class="close">&times;</span><h3>跟进记录-${record.customerName}</h3>${listHtml}</div>`;
        document.body.appendChild(modal);
        modal.querySelector('.close').onclick=()=>modal.remove();
        modal.onclick=e=>{if(e.target===modal) modal.remove();};
    }
    function showCustomerDetail(recordId) {

        const order = orders.find(o => o.id === orderId);

        const currentCost = order.customCost !== undefined ? order.customCost : (order.cost || 0);
        const newCost = prompt("请输入该订单的实际成本（元）:", currentCost);
        if (newCost === null) return;
        const costNum = parseFloat(newCost);
        if (isNaN(costNum) || costNum <= 0) { alert("请输入有效的正数"); return; }
        order.customCost = costNum;
        order.commission = calculateOrderCommission(order);
        saveData();
        alert("成本已更新，提成已重新计算");
        refreshUI();

    function exportToCSV(data, filename) {
        if (!data || data.length === 0) return;
        const headers = Object.keys(data[0]);
        const csvRows = [headers.join(",")];
        for (const row of data) {
            const values = headers.map(header => {
                let value = row[header] !== undefined ? row[header] : "";
                if (typeof value === "string" && (value.includes(",") || value.includes("\n") || value.includes("\""))) value = "\"" + value.replace(/"/g, "\"\"") + "\"";
                return value;
            });
            csvRows.push(values.join(","));
        }
        const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.href = url;
        link.setAttribute("download", filename);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        alert(`已导出 ${data.length} 条记录到文件: ${filename}`);
    }

            const sheet = workbook.Sheets[workbook.SheetNames[0]];

            let successCount = 0, duplicateCount = 0;
            for (const row of rows) {

                if (checkDuplicate(customerName, contactPhone)) { duplicateCount++; continue; }

                successCount++;
            }
            saveData();
            alert(`导入完成：成功 ${successCount} 条，重复跳过 ${duplicateCount} 条`);
            refreshUI();
        };

    function createOrder(recordId) {
        const record = records.find(r => r.id === recordId);
        if (!record) { alert("客户记录不存在"); return; }
        if (record.hasOrder) { alert("该客户已经成交，不能重复下单"); return; }
        const orderNo = prompt("请输入订单号：", "ORD" + Date.now());
        if (!orderNo || !orderNo.trim()) { alert("订单号不能为空"); return; }
        const amount = parseFloat(prompt("请输入订单金额（元）：", "5000"));
        if (isNaN(amount) || amount <= 0) { alert("请输入有效的正数金额"); return; }
        const isPublic = isInPublicSea(record);
        if (isPublic) record.operatorId = currentUser.id;
        const newOrder = {
            id: getNextOrderId(),
            recordId: record.id,
            orderNo: orderNo.trim(),
            orderAmount: amount,
            commission: 0,
            isPaid: 1,
            paidTime: getTodayStr(),
            cost: null,
            customCost: null
        };
        newOrder.commission = calculateOrderCommission(newOrder);
        orders.push(newOrder);
        record.hasOrder = true;
        recordLog("创建订单", `${record.customerName} / ${newOrder.orderNo} / ¥${amount.toFixed(2)}`);
        saveData();
        alert(`订单 ${newOrder.orderNo} 创建成功${isPublic ? "，客户已归属到您名下" : ""}`);
        refreshUI();
    }

    function addFollowup(recordId) {
        const record = records.find(r => r.id === recordId);
        if (!record) return;
        if (record.hasOrder) { alert("已合作客户不能继续添加跟进"); return; }
        const content = prompt("请输入跟进内容：");
        if (!content || !content.trim()) return;
        let isVisit = confirm("这次跟进是否约访成功？");
        let visitDate = null;
        if (isVisit) {
            const visitDateStr = prompt("请输入约访日期（YYYY-MM-DD）：", getTodayStr());
            if (visitDateStr && /^\d{4}-\d{2}-\d{2}/.test(visitDateStr.trim())) visitDate = visitDateStr.trim().match(/^\d{4}-\d{2}-\d{2}/)[0];
            else isVisit = false;
        }
        let nextFollowupDate = null;
        const nextFollowup = prompt("请输入下次跟进日期（YYYY-MM-DD），不填则不提醒：", "");
        if (nextFollowup && /^\d{4}-\d{2}-\d{2}/.test(nextFollowup.trim())) nextFollowupDate = nextFollowup.trim().match(/^\d{4}-\d{2}-\d{2}/)[0];
        const newFollowup = {
            id: getNextFollowupId(),
            recordId,
            operatorId: currentUser.id,
            content: content.trim(),
            createTime: getTodayStr(),
            nextFollowup: nextFollowupDate,
            isVisit: isVisit ? 1 : 0,
            visitDate
        };
        followups.push(newFollowup);
        updateRecordFollowupStats(recordId);
        recordLog("新增跟进", `${record.customerName} / ${content.trim().slice(0, 30)}`);
        saveData();
        alert("跟进记录已添加");
        refreshUI();
    }

    function setOrderCostSimple(orderId) {
        const order = orders.find(o => o.id === orderId);
        if (!order) return;
        const currentCost = order.customCost !== undefined ? order.customCost : (order.cost || 0);
        const newCost = prompt("请输入该订单的实际成本（元）：", currentCost);
        if (newCost === null) return;
        const costNum = parseFloat(newCost);
        if (isNaN(costNum) || costNum <= 0) { alert("请输入有效的正数"); return; }
        order.customCost = costNum;
        order.commission = calculateOrderCommission(order);
        recordLog("更新订单成本", `${order.orderNo} / ¥${costNum.toFixed(2)}`);
        saveData();
        alert("订单成本已更新，提成已重新计算");
        refreshUI();
    }

            users = users.filter(u => u.id !== opId);
            const removedRecordIds = records.filter(r => r.operatorId === opId).map(r => r.id);
            records = records.filter(r => r.operatorId !== opId);
            followups = followups.filter(f => f.operatorId !== opId && !removedRecordIds.includes(f.recordId));
            orders = orders.filter(o => !removedRecordIds.includes(o.recordId));
            Object.keys(dailyCalls).forEach(key => { if (key.startsWith(`${opId}-`)) delete dailyCalls[key]; });
            Object.keys(dailyWechat).forEach(key => { if (key.startsWith(`${opId}-`)) delete dailyWechat[key]; });
            delete operatorScripts[opId];

    function importCustomers(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: "array" });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet);
            let successCount = 0;
            let duplicateCount = 0;
            for (const row of rows) {
                const customerName = row["客户名称"] || "";
                const contactPhone = row["联系电话"] || "";
                if (!customerName || !contactPhone) continue;
                if (checkDuplicate(customerName, contactPhone)) { duplicateCount++; continue; }
                records.push({
                    id: getNextRecordId(),
                    operatorId: null,
                    customerName,
                    contactPerson: row["联系人"] || "",
                    position: row["职位"] || "",
                    contactPhone,
                    content: row["备注"] || "",
                    intentLevel: 1,
                    hasWechat: 0,
                    createTime: getTodayStr(),
                    auditStatus: 1,
                    hasOrder: false,
                    followupCount: 0,
                    lastFollowupTime: getTodayStr(),
                    nextFollowupTime: null,
                    isVisit: 0,
                    visitDate: null,
                    tags: []
                });
                successCount++;
            }
            recordLog("批量导入客户", `成功 ${successCount} 条，跳过重复 ${duplicateCount} 条`);
            saveData();
            alert(`导入完成：成功 ${successCount} 条，跳过重复 ${duplicateCount} 条`);
            refreshUI();
        };
        reader.readAsArrayBuffer(file);
    }

    function getCustomerPreviewText(record) {
        const text = (record.content || "").trim();
        if (!text) return "暂无沟通内容，点开后可以继续补充。";
        return text.length > 42 ? `${text.slice(0, 42)}...` : text;
    }

    function getCustomerAlertText(record, tabType) {
        const today = getTodayStr();
        if (tabType === "followup") {
            if (record.nextFollowupTime && record.nextFollowupTime < today) return `已逾期，原计划 ${record.nextFollowupTime} 跟进`;
            if (record.nextFollowupTime && record.nextFollowupTime === today) return "今天需要优先跟进";
            if (record.nextFollowupTime) return `下次跟进：${record.nextFollowupTime}`;
            return "待安排下次跟进";
        }
        if (tabType === "public") {
            const daysLeft = getDaysUntilPublicSea(record);
            if (daysLeft === null || daysLeft <= 0) return "已在公海，可立即领取";
            return `${daysLeft} 天后进入公海`;
        }
        if (record.lastFollowupTime) return `最后跟进：${record.lastFollowupTime}`;
        return "暂无跟进记录";
    }

    function getCustomerCardClass(record, tabType) {
        if (tabType === "followup" && record.nextFollowupTime && record.nextFollowupTime <= getTodayStr()) return "urgent";
        if (record.intentLevel === 2) return "hot";
        return "";
    }

        const chips = [

        if (!customerVisibleCounts[containerId]) customerVisibleCounts[containerId] = CUSTOMER_BATCH_SIZE;
        return customerVisibleCounts[containerId];
    }

        customerVisibleCounts[containerId] = ensureCustomerVisibleCount(containerId) + CUSTOMER_BATCH_SIZE;
        if (containerId === "followupRecordsList") renderFollowupRecords();
        else if (containerId === "myRecordsList") renderMyRecords();
        else if (containerId === "publicRecordsList") renderPublicRecords();
    }

    function disconnectCustomerObserver(containerId) {
        if (customerListObservers[containerId]) {
            customerListObservers[containerId].disconnect();
            delete customerListObservers[containerId];
        }
    }

            container.innerHTML = `<div class="empty-state">${emptyText}</div>`;
            return;
        }
        const visibleCount = Math.min(ensureCustomerVisibleCount(containerId), list.length);
        const visibleList = list.slice(0, visibleCount);
        const hasMore = visibleCount < list.length;
        container.innerHTML = `
            <div class="customer-panel">
                <div class="customer-panel-head">
                    <div>
                        <strong>当前显示 ${visibleCount} / ${list.length} 条客户</strong>

                    </div>
                    <div class="customer-toggle-row">
                        <button type="button" class="outline list-expand-all" data-target="${containerId}">全部展开</button>
                        <button type="button" class="secondary list-collapse-all" data-target="${containerId}">全部收起</button>
                    </div>
                </div>
                <div class="customer-list">${visibleList.map(item => renderCustomerCard(item, tabType)).join("")}</div>
                ${hasMore ? `
                    <div class="load-more-wrap">
                        <button type="button" class="outline load-more-btn" data-target="${containerId}">继续加载 ${Math.min(CUSTOMER_BATCH_SIZE, list.length - visibleCount)} 条</button>
                        <div class="load-more-note">剩余 ${list.length - visibleCount} 条，滚动到底部也会自动加载。</div>
                        <div class="load-more-sentinel" data-target="${containerId}"></div>
                    </div>
                ` : `<div class="load-more-note">已显示全部客户</div>`}
            </div>
        `;
    }

    function bindCustomerPanelControls() {
        document.querySelectorAll(".list-expand-all").forEach(btn => {
            btn.onclick = () => {
                const root = document.getElementById(btn.dataset.target);
                if (!root) return;
                root.querySelectorAll("details.customer-card").forEach(item => { item.open = true; });
            };
        });
        document.querySelectorAll(".list-collapse-all").forEach(btn => {
            btn.onclick = () => {
                const root = document.getElementById(btn.dataset.target);
                if (!root) return;
                root.querySelectorAll("details.customer-card").forEach(item => { item.open = false; });
            };
        });
        document.querySelectorAll(".load-more-btn").forEach(btn => {
            btn.onclick = () => loadMoreCustomers(btn.dataset.target);
        });
        document.querySelectorAll(".load-more-sentinel").forEach(el => {
            const containerId = el.dataset.target;
            if (!containerId || !("IntersectionObserver" in window)) return;
            disconnectCustomerObserver(containerId);
            const observer = new IntersectionObserver(entries => {
                if (entries.some(entry => entry.isIntersecting)) {
                    disconnectCustomerObserver(containerId);
                    loadMoreCustomers(containerId);
                }
            }, { rootMargin: "160px 0px" });
            observer.observe(el);
            customerListObservers[containerId] = observer;
        });
    }

    function renderOperator() {
        const stats = calculateStats(currentUser.id);
        const myCustomers = getMyPendingCustomers(currentUser.id);
        const followupCustomers = getMyFollowupCustomers(currentUser.id);
        const publicSeaCustomers = getPublicSeaCustomers();
        const today = getTodayStr();
        const dailyStats = getDailyStats(currentUser.id, today);
        const totalWechat = getTotalWechat(currentUser.id);
        const workbench = getOperatorWorkbenchData(currentUser.id);
        const modeLabel = storageMode === "bmob" ? "在线模式" : "本地模式";
        const filterSource = Array.from(new Map([...followupCustomers, ...myCustomers, ...publicSeaCustomers].map(item => [item.id, item])).values());
        const dueTodayNames = workbench.dueToday.slice(0, 5).map(item => item.customerName).join("、");
        const highIntentNames = workbench.highIntent.slice(0, 5).map(item => item.customerName).join("、");
        const untouchedNames = workbench.untouched.slice(0, 5).map(item => item.customerName).join("、");
        return `
            <div class="container">
                <div class="nav">
                    <button class="logout-btn" id="logoutBtn">退出登录</button>
                    <h2>业务员：${escapeHtml(currentUser.name)} <span class="version-tag">v${APP_VERSION}</span></h2>

                    <div>
                        <div><strong>当前状态</strong> <span class="status-pill">${modeLabel}</span></div>
                        <div class="status-meta">${escapeHtml(syncStatusText)}</div>
                    </div>
                    <div class="action-row">
                        <button id="manualSyncBtn" class="outline">立即同步</button>
                        <button id="exportLocalBackupBtn" class="secondary">导出本地备份</button>
                    </div>
                </div>
                <div class="overview-grid">
                    <div class="overview-card"><div class="overview-value">${workbench.dueToday.length}</div><div class="overview-label">今日待跟进</div></div>
                    <div class="overview-card"><div class="overview-value">${workbench.highIntent.length}</div><div class="overview-label">深度意向</div></div>
                    <div class="overview-card"><div class="overview-value">${workbench.untouched.length}</div><div class="overview-label">7天内可能掉公海</div></div>
                    <div class="overview-card"><div class="overview-value">${workbench.publicSea.length}</div><div class="overview-label">公海客户池</div></div>
                </div>
                <div class="grid-2">
                    <div class="card toolbar-card">
                        <h3>新增客户沟通记录</h3>
                        <form id="recordForm">
                            <input type="text" id="customerName" placeholder="客户名称 *" required>
                            <input type="text" id="contactPerson" placeholder="联系人">
                            <input type="text" id="position" placeholder="客户职位">
                            <input type="tel" id="contactPhone" placeholder="联系电话 *" required>
                            <textarea id="content" rows="2" placeholder="沟通内容"></textarea>
                            <select id="intentLevel">
                                <option value="1">意向客户</option>
                                <option value="2">深度意向</option>
                                <option value="3">无效客户</option>
                            </select>
                            <button type="submit" style="width:100%">保存记录</button>
                        </form>
                        <div class="action-row" style="margin-top:12px;">
                            <button id="mockOrderBtn" class="outline" style="flex:1;">模拟成交</button>
                        </div>
                    </div>
                    <div class="card">
                        <h3>个人业绩看板</h3>
                        <div class="daily-stats-row">
                            <div class="quick-card"><div class="quick-number">${stats.validIntents}</div><div class="quick-muted">意向客户</div></div>
                            <div class="quick-card"><div class="quick-number">${stats.deepIntents}</div><div class="quick-muted">深度意向</div></div>
                            <div class="quick-card"><div class="quick-number">${stats.orderCount}</div><div class="quick-muted">成交订单</div></div>
                            <div class="quick-card"><div class="quick-number">¥${stats.totalBonus.toFixed(0)}</div><div class="quick-muted">当前奖金</div></div>
                        </div>
                        <div class="flex-between"><span>已加微信</span><strong>${stats.wechatCount}</strong></div>
                        <div class="flex-between"><span>总积分</span><strong>${stats.totalPoints}</strong></div>
                        <div class="flex-between"><span>约访成功</span><strong>${stats.visitCount}</strong></div>
                        <div class="flex-between"><span>成交总额</span><strong>¥${stats.totalOrderAmount.toFixed(2)}</strong></div>
                        <div class="flex-between"><span>无效客户</span><strong>${stats.invalidCount}</strong></div>
                        <hr>
                        <div class="flex-between"><span>意向奖励</span><strong>¥${stats.intentBonus.toFixed(2)}</strong></div>
                        <div class="flex-between"><span>约访奖励</span><strong>¥${stats.visitBonus.toFixed(2)}</strong></div>
                        <div class="flex-between"><span>成交提成</span><strong>¥${stats.orderCommission.toFixed(2)}</strong></div>
                        <div class="flex-between"><span>预计总收入</span><strong>¥${(MONTHLY_SALARY + stats.totalBonus).toFixed(2)}</strong></div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="card">
                        <h3>我的工作台</h3>
                        <div class="workbench-list">
                            <div class="workbench-item"><strong>今天优先处理</strong><div class="mini-note">${escapeHtml(dueTodayNames || "今天没有到期跟进客户")}</div></div>
                            <div class="workbench-item"><strong>深度意向名单</strong><div class="mini-note">${escapeHtml(highIntentNames || "当前没有深度意向客户")}</div></div>
                            <div class="workbench-item"><strong>临近掉公海客户</strong><div class="mini-note">${escapeHtml(untouchedNames || "当前没有临近掉公海的客户")}</div></div>
                        </div>
                    </div>
                    <div class="card">
                        <h3>每日通话登记</h3>
                        <div class="flex-between" style="gap:16px; flex-wrap:wrap;">
                            <div><label>日期</label><input type="date" id="dailyDate" value="${today}" style="width:auto;"></div>
                            <div><label>通话总数</label><input type="number" id="dailyCallCount" value="${dailyStats.callCount}" style="width:100px;"></div>
                            <div><label>新增微信</label><input type="number" id="dailyWechatCount" value="${dailyStats.wechatCount}" style="width:100px;"></div>
                            <button id="saveDailyBtn" class="outline">保存</button>
                        </div>
                        <div class="daily-stats-row">
                            <div class="stat-item"><div class="stat-value">${dailyStats.callCount}</div><div class="stat-label">今日通话</div></div>
                            <div class="stat-item"><div class="stat-value">${dailyStats.wechatCount}</div><div class="stat-label">今日新增微信</div></div>
                            <div class="stat-item"><div class="stat-value">${totalWechat}</div><div class="stat-label">累计微信人数</div></div>
                            <div class="stat-item"><div class="stat-value">${dailyStats.validIntents}</div><div class="stat-label">意向客户</div><div class="percent-value">${dailyStats.callCount ? ((dailyStats.validIntents / dailyStats.callCount) * 100).toFixed(1) : 0}%</div></div>
                            <div class="stat-item"><div class="stat-value">${dailyStats.deepIntents}</div><div class="stat-label">深度意向</div><div class="percent-value">${dailyStats.callCount ? ((dailyStats.deepIntents / dailyStats.callCount) * 100).toFixed(1) : 0}%</div></div>
                            <div class="stat-item"><div class="stat-value">${dailyStats.visitSuccess}</div><div class="stat-label">约访成功</div><div class="percent-value">${dailyStats.callCount ? ((dailyStats.visitSuccess / dailyStats.callCount) * 100).toFixed(1) : 0}%</div></div>
                        </div>
                        <button class="collapsible" id="weeklyCollapseBtn">近一周数据</button>
                        <div class="collapsible-content" id="weeklyCollapseContent"><div id="weeklyCardsContainer" class="weekly-cards"></div></div>
                    </div>
                </div>
                <div class="card">
                    <h3>客户筛选</h3>
                    ${renderCustomerFilterPanel(filterSource)}
                    <div class="mini-note">支持按客户名、电话、标签、微信状态、约访状态快速过滤。客户列表已改成折叠卡片，信息多时会更好用。</div>
                </div>
                <div class="card">
                    <div class="tab-buttons">
                        <button class="tab-btn active" data-tab="followup">待跟进客户 (${followupCustomers.length})</button>
                        <button class="tab-btn" data-tab="my">我的客户 (${myCustomers.length})</button>
                        <button class="tab-btn" data-tab="public">公海客户 (${publicSeaCustomers.length})</button>
                    </div>
                    <div class="tab-content active" id="tab-followup"><div id="followupRecordsList"></div></div>
                    <div class="tab-content" id="tab-my"><div id="myRecordsList"></div></div>
                    <div class="tab-content" id="tab-public"><div id="publicRecordsList"></div></div>
                </div>
            </div>
        `;
    }

    function renderFollowupRecords() {
        const followupCustomers = getFilteredCustomers(getMyFollowupCustomers(currentUser.id));
        renderCustomerPanel("followupRecordsList", followupCustomers, "followup", "当前筛选条件下没有待跟进客户");
        bindCustomerPanelControls();
        attachTagClickEvents();
        attachButtons();
        bindEditCustomerButtons();
    }

    function renderMyRecords() {
        const myCustomers = getFilteredCustomers(getMyPendingCustomers(currentUser.id));
        renderCustomerPanel("myRecordsList", myCustomers, "my", "当前筛选条件下没有客户");
        bindCustomerPanelControls();
        attachTagClickEvents();
        attachButtons();
        bindEditCustomerButtons();
    }

    function renderPublicRecords() {
        const publicCustomers = getFilteredCustomers(getPublicSeaCustomers());
        renderCustomerPanel("publicRecordsList", publicCustomers, "public", "当前筛选条件下没有公海客户");
        bindCustomerPanelControls();
        attachTagClickEvents();
        attachButtons();
    }

    async function startApp() {
        await loadData();
        initDemoData();
        if (storageMode === "bmob") saveData();
        refreshUI();
    }

    startApp();
</script>
</body>
